server:
  port: 8080

spring:
  application:
    name: face-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://<lan-host>:2009/face_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: ***REMOVED***
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      location: e:/Face-app-web/backend-java/uploads

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 日志配置
logging:
  level:
    com.bonuos.face: debug
    com.bonuos.face.mapper: debug
