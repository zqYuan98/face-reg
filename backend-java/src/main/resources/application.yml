server:
  port: 8080
  forward-headers-strategy: none
  tomcat:
    threads:
      max: 64
      min-spare: 4
    accept-count: 100
    connection-timeout: 10s

spring:
  application:
    name: face-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${FACE_DB_URL:jdbc:mysql://127.0.0.1:3306/face_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${FACE_DB_USER:face_app}
    password: ${FACE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      data-source-properties:
        connectTimeout: 2000
        socketTimeout: 10000
  sql:
    init:
      mode: never
  jdbc:
    template:
      query-timeout: 5s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      location: ${FACE_UPLOAD_DIR:./uploads}

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    default-statement-timeout: 5
    local-cache-scope: STATEMENT
  global-config:
    db-config:
      id-type: auto

# 日志配置
logging:
  level:
    com.bonuos.face: info
    com.bonuos.face.mapper: warn
