<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/company_icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 人脸识别智能管理系统</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1f2d3d 0%, #304156 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .login-card {
            width: 400px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .login-title {
            text-align: center;
            color: #fff;
            font-size: 24px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .login-btn {
            width: 100%;
            padding: 12px 0;
            font-size: 16px;
        }

        /* Override Element form labels and inputs for dark theme */
        .el-form-item__label {
            color: #ccc !important;
        }

        .el-input__wrapper {
            background-color: rgba(255, 255, 255, 0.05) !important;
            box-shadow: none !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
        }

        .el-input__wrapper:hover,
        .el-input__wrapper.is-focus {
            border-color: #409EFF !important;
        }

        .el-input__inner {
            color: #fff !important;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="login-card">
            <div class="login-title">
                <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
                    <img src="company_icon.png"
                        style="width: 40px; height: 40px; margin-right: 15px; border-radius: 50%;">
                    <span style="font-size: 24px; font-weight: bold;">安徽博诺思信息科技有限公司</span>
                </div>
                <div style="font-size: 18px; opacity: 0.8; font-weight: normal;">人脸识别智能管理系统</div>
            </div>
            <el-alert v-if="navigationWarning" :title="navigationWarning" type="warning" :closable="false" show-icon
                style="margin-bottom: 16px"></el-alert>
            <el-button v-if="sessionConfirmed" type="primary" plain :disabled="loading || checkingSession"
                style="width: 100%; margin-bottom: 16px" @click="enterConfirmedIndex">进入管理后台</el-button>
            <el-alert v-if="sessionError" :title="sessionError" type="warning" :closable="false" show-icon
                style="margin-bottom: 16px">
                <el-button link :disabled="loading || checkingSession" @click="checkSession">重新验证登录状态</el-button>
            </el-alert>
            <el-form label-position="top" size="large" @submit.prevent="handleLogin">
                <el-form-item label="账号">
                    <el-input v-model="form.username" placeholder="请输入账号" :prefix-icon="User"
                        autocomplete="username"></el-input>
                </el-form-item>
                <el-form-item label="密码">
                    <el-input v-model="form.password" type="password" placeholder="请输入密码" :prefix-icon="Lock"
                        autocomplete="current-password"></el-input>
                </el-form-item>
                <el-form-item style="margin-top: 30px;">
                    <el-button type="primary" class="login-btn" native-type="submit"
                        :loading="loading || checkingSession" :disabled="checkingSession">
                        {{ checkingSession ? '正在验证登录状态' : '登 录' }}
                    </el-button>
                </el-form-item>
            </el-form>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus/dist/index.full.js"></script>
    <script src="https://unpkg.com/@element-plus/icons-vue"></script>

    <script>
        const { createApp, reactive, ref, onMounted, onBeforeUnmount } = Vue;
        const app = createApp({
            setup() {
                const UI_VERSION = '20260930-auth2';
                const INDEX_URL = `index.html?v=${UI_VERSION}`;
                const NAVIGATION_KEY = 'face_admin_navigation';
                const loading = ref(false);
                const checkingSession = ref(false);
                const sessionError = ref('');
                const navigationWarning = ref('');
                const sessionConfirmed = ref(false);
                const entry = new URLSearchParams(window.location.search || '');
                let automaticEntryBlocked = entry.get('reauth') === '1' || entry.get('logout') === '1';
                if (entry.get('reauth') === '1') {
                    navigationWarning.value = '管理后台未能确认登录状态，已停止自动跳转。请重新登录，或确认会话后点击进入管理后台。';
                }
                // This short-lived marker only stops navigation loops; the server still authenticates every request.
                try {
                    const pending = JSON.parse(sessionStorage.getItem(NAVIGATION_KEY) || 'null');
                    const age = pending ? Date.now() - pending.at : -1;
                    if (pending?.version === UI_VERSION && age >= 0 && age < 30000) {
                        automaticEntryBlocked = true;
                        navigationWarning.value ||= '刚才未能进入管理后台，已停止重复跳转。请重新登录，或确认会话后点击进入管理后台。';
                    } else if (pending) sessionStorage.removeItem(NAVIGATION_KEY);
                } catch (_) {
                    automaticEntryBlocked = true;
                    navigationWarning.value ||= '浏览器暂时无法记录页面跳转，已关闭自动跳转。请登录或手动进入管理后台。';
                }
                let csrfPromise = null;
                let sessionSequence = 0;
                let sessionController = null;
                let sessionTimer = null;
                let navigating = false;
                let disposed = false;
                const form = reactive({
                    username: '',
                    password: ''
                });

                const readResponse = async response => {
                    let result;
                    try { result = await response.json(); }
                    catch (_) { throw new Error('服务器响应异常，请稍后重试'); }
                    if (!response.ok || result.code !== 200) {
                        throw new Error(result.msg || (response.status === 403
                            ? '安全校验失败，请重新点击登录' : '登录失败，请检查账号和密码'));
                    }
                    return result;
                };
                const loadCsrf = () => {
                    if (!csrfPromise) csrfPromise = (async () => {
                        const result = await readResponse(await fetch('/api/csrf', { credentials: 'same-origin' }));
                        if (!result.data?.token || result.data.headerName !== 'X-CSRF-TOKEN') {
                            throw new Error('安全校验信息缺失，请刷新页面后重试');
                        }
                        return result.data;
                    })().catch(error => { csrfPromise = null; throw error; });
                    return csrfPromise;
                };
                const cancelSessionCheck = () => {
                    sessionSequence++;
                    if (sessionController) sessionController.abort();
                    clearTimeout(sessionTimer);
                    sessionController = null;
                    sessionTimer = null;
                    checkingSession.value = false;
                };
                const enterIndex = (explicit = false) => {
                    if (disposed || navigating) return;
                    try {
                        sessionStorage.setItem(NAVIGATION_KEY, JSON.stringify({ version: UI_VERSION, at: Date.now() }));
                    } catch (_) {
                        if (!explicit) {
                            automaticEntryBlocked = true;
                            navigationWarning.value = '浏览器暂时无法记录页面跳转，已关闭自动跳转。请点击进入管理后台。';
                            return;
                        }
                    }
                    navigating = true;
                    form.password = '';
                    window.location.replace(INDEX_URL);
                };
                const enterConfirmedIndex = () => {
                    if (sessionConfirmed.value && !loading.value && !checkingSession.value) enterIndex(true);
                };
                const checkSession = async () => {
                    if (loading.value || checkingSession.value || navigating || disposed) return;
                    const sequence = ++sessionSequence;
                    const controller = new AbortController();
                    sessionController = controller;
                    checkingSession.value = true;
                    sessionConfirmed.value = false;
                    sessionError.value = '';
                    let timer;
                    try {
                        const identity = await Promise.race([
                            (async () => {
                                const response = await fetch('/api/me', {
                                    credentials: 'same-origin', cache: 'no-store', signal: controller.signal
                                });
                                if (response.status === 401) return null;
                                const result = await readResponse(response);
                                if (typeof result.data?.username !== 'string' || !result.data.username.trim()) {
                                    throw new Error('服务器未返回有效的登录身份');
                                }
                                return result.data;
                            })(),
                            new Promise((_, reject) => {
                                timer = setTimeout(() => {
                                    reject(new Error('登录状态验证超时，可重新验证或直接登录'));
                                    controller.abort();
                                }, 5000);
                                sessionTimer = timer;
                            })
                        ]);
                        if (sequence === sessionSequence) {
                            sessionConfirmed.value = Boolean(identity);
                            if (identity && !automaticEntryBlocked) enterIndex();
                        }
                    } catch (error) {
                        if (sequence === sessionSequence && !disposed) {
                            sessionError.value = error.message || '暂时无法验证登录状态，可重新验证或直接登录';
                        }
                    } finally {
                        clearTimeout(timer);
                        if (sequence === sessionSequence) {
                            sessionController = null;
                            sessionTimer = null;
                            checkingSession.value = false;
                        }
                    }
                };
                const handleLogin = async () => {
                    if (loading.value || checkingSession.value || navigating || disposed) return;
                    if (!form.username || !form.password) {
                        return ElementPlus.ElMessage.warning('请输入账号和密码');
                    }
                    cancelSessionCheck();
                    sessionError.value = '';
                    loading.value = true;
                    try {
                        const csrf = await loadCsrf();
                        const response = await fetch('/api/login', {
                            method: 'POST',
                            credentials: 'same-origin',
                            headers: { 'Content-Type': 'application/json', [csrf.headerName]: csrf.token },
                            body: JSON.stringify(form)
                        });
                        await readResponse(response);
                        // The index page obtains the rotated CSRF token before its first write.
                        csrfPromise = null;
                        form.password = '';
                        ElementPlus.ElMessage.success('登录成功');
                        enterIndex(true);
                    } catch (error) {
                        csrfPromise = null;
                        ElementPlus.ElMessage.error(error.message || '网络错误，请稍后重试');
                    } finally {
                        loading.value = false;
                    }
                };

                onMounted(checkSession);
                onBeforeUnmount(() => {
                    disposed = true;
                    cancelSessionCheck();
                });

                return {
                    form,
                    loading,
                    checkingSession,
                    sessionError,
                    navigationWarning,
                    sessionConfirmed,
                    checkSession,
                    enterConfirmedIndex,
                    handleLogin,
                    User: ElementPlusIconsVue.User,
                    Lock: ElementPlusIconsVue.Lock,
                    Platform: ElementPlusIconsVue.Platform
                }
            }
        });

        for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
            app.component(key, component)
        }
        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>

</html>
